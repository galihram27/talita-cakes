# Menjalankan npm test di backend dan frontend setiap ada push atau pull
# request. Hasilnya tampil sebagai centang hijau / silang merah di commit dan
# di tab Actions repo.
#
# Tidak butuh rahasia apa pun: test tidak menyentuh basis data maupun layanan
# luar, jadi .env memang tidak ada di sini.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Kalau backend gagal, frontend tetap dijalankan sampai selesai, supaya
      # sekali push langsung kelihatan kondisi keduanya.
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm test
